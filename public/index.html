<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fizik 11 - Çalışma Notları</title>
    <style>
        * { box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a73e8 0%, #00b4d8 50%, #90e0ef 100%); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; justify-content: center; align-items: center; }
        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10px; background: transparent; position: relative; }
        @media (min-width: 768px) { .app-container { max-width: 850px; max-height: 85vh; height: 85vh; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(18, 18, 18, 0.4); backdrop-filter: blur(16px); padding: 20px; } }
        .hidden { display: none !important; }
        .glass-box { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px 0 rgba(0, 30, 60, 0.37); border-radius: 12px; padding: 15px; }
        .center-screen { position: absolute; width: 90%; max-width: 400px; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; text-align: center; z-index: 100; }
        .center-screen input, .center-screen button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.3); color: #fff; width: 220px; text-align: center; outline: none; }
        .aero-btn { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); border: 1px solid #ffffff; color: #fff; font-weight: bold; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 5px rgba(0,0,0,0.2); text-shadow: 0 1px 1px rgba(0,0,0,0.3); }
        .aero-btn:hover { background: linear-gradient(to bottom, #00f2fe 0%, #4facfe 100%); }
        
        #chatContainer { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; position: relative; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 5px; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
        .chat-header:hover { background: rgba(255,255,255,0.1); }
        .header-buttons { display: flex; gap: 6px; }

        /* Sabitlenmiş Mesaj Barı */
        #pinnedBar { background: rgba(0, 0, 0, 0.4); border-left: 4px solid #ffeb3b; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        #pinnedBar:hover { background: rgba(0, 0, 0, 0.6); }

        #chat { flex: 1; border-radius: 10px; padding: 12px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .message { background: rgba(255, 255, 255, 0.25); padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 85%; word-break: break-word; border: 1px solid rgba(255,255,255,0.2); transition: background 0.5s; }
        .message.mentioned { background: rgba(255, 193, 7, 0.35); border-color: #ffc107; box-shadow: 0 0 10px rgba(255,193,7,0.4); }
        .message.is-pinned { border-color: #ffeb3b; box-shadow: 0 0 8px rgba(255,235,59,0.3); }
        
        .pin-btn { background: none; border: none; cursor: pointer; opacity: 0.3; transition: opacity 0.2s; padding: 0 5px; font-size: 12px; margin-left: 5px; }
        .pin-btn:hover { opacity: 1; }

        .form-group { position: relative; display: flex; gap: 8px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); font-size: 16px; background: rgba(255, 255, 255, 0.2); color: #fff; outline: none; }
        #messageInput { flex: 1; }
        .mention-menu { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; width: 250px; background: #2a2f32; border-radius: 8px; box-shadow: 0 -4px 15px rgba(0,0,0,0.4); display: none; flex-direction: column; z-index: 1000; overflow-y: auto; max-height: 200px; border: 1px solid rgba(255,255,255,0.1); }
        .mention-item { padding: 10px 15px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .mention-item:hover { background: #3b4043; }
        .action-btn { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        #groupInfoOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .group-info-modal { background: rgba(25, 30, 40, 0.95); width: 90%; max-width: 350px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); max-height: 85vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; }
        .participant-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .admin-badge { background: #ff4757; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .make-admin-btn { background: #4facfe; border: none; color: white; font-size: 10px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="lockScreen" class="glass-box center-screen">
            <h2>📚 Fizik 11 - Ünite 2 Notları</h2>
            <input id="pinInput" type="password" placeholder="Şifre..." />
            <button class="aero-btn" onclick="checkPin()">Giriş Yap</button>
            <p id="errorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;">Hatalı şifre!</p>
        </div>
        
        <div id="nicknameScreen" class="glass-box center-screen hidden">
            <h2>🚗 Project TR // Nickname</h2>
            <p style="font-size: 13px; margin: 0; color: rgba(255,255,255,0.9);">Bu cihaz için adını belirle (2 hafta değiştiremezsin):</p>
            <input id="nicknameInput" type="text" placeholder="Kullanıcı adın..." autocomplete="off" />
            <button class="aero-btn" onclick="setNickname()">Sisteme Gir</button>
            <p id="nickErrorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;"></p>
        </div>

        <div id="chatContainer" class="hidden">
            <div class="chat-header" onclick="openGroupInfo()">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="headerGroupIcon" src="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #fff;">
                    <div>
                        <h2 style="margin: 0; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">Project TR</h2>
                        <span style="font-size: 11px; color: #ddd;" id="headerUserCount">Sohbeti görmek için tıkla</span>
                    </div>
                </div>
                <div class="header-buttons" onclick="event.stopPropagation();">
                    <button id="notifBtn" class="action-btn" onclick="toggleNotifications()">🔔</button>
                </div>
            </div>

            <!-- SABİTLENMİŞ MESAJ BARI -->
            <div id="pinnedBar" class="hidden" onclick="scrollToPinned()">
                <div style="font-weight: bold; color: #ffeb3b; font-size: 11px; margin-bottom: 2px;">📌 Sabitlenmiş Mesaj</div>
                <div id="pinnedContent" style="font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
            </div>
            
            <div id="chat" class="glass-box"></div>
            
            <form id="form" class="form-group">
                <div id="mentionDropdown" class="mention-menu"></div>
                <input id="messageInput" type="text" placeholder="Mesajını yaz veya @etiketle..." required autocomplete="off" />
                <button class="aero-btn" type="submit">Gönder</button>
            </form>
        </div>

        <div id="groupInfoOverlay" class="hidden">
            <div class="group-info-modal">
                <button class="close-btn" onclick="closeGroupInfo()">×</button>
                <img id="modalGroupIcon" src="" style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 10px; display: block; object-fit: cover; border: 3px solid #4facfe;">
                <h2 style="text-align: center; margin: 0 0 5px 0;">Project TR</h2>
                <p style="text-align: center; font-size: 12px; color: #aaa; margin: 0 0 15px 0;">Senin Nickin: <span id="currentUserDisplay" style="color: #ffeb3b;"></span></p>

                <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <p style="font-size: 11px; margin: 0 0 5px 0; color: #ffeb3b; font-weight: bold;">👤 KİŞİSEL PROFİL FOTOĞRAFIN</p>
                    <input id="myAvatarUrl" type="text" placeholder="Fotoğraf URL'si (İnternetten link yapıştır)" style="width: 100%; padding: 8px; font-size: 12px; margin-bottom: 5px; border-radius: 4px;">
                    <button class="aero-btn" onclick="updateMyAvatar()" style="width: 100%; padding: 6px; font-size: 12px; border-radius: 4px;">Fotoğrafımı Güncelle</button>
                    <button onclick="requestChangeNick()" style="width: 100%; margin-top: 5px; padding: 6px; font-size: 11px; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #aaa; cursor: pointer;">Nickimi Değiştir (2 Haftada Bir)</button>
                </div>

                <div id="adminControls" class="hidden" style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #4facfe;">
                    <p style="font-size: 11px; margin: 0 0 5px 0; color: #4facfe; font-weight: bold;">👑 GRUP YÖNETİCİ PANELİ</p>
                    <input id="newIconUrl" type="text" placeholder="Yeni Grup Fotoğrafı URL'si" style="width: 100%; padding: 8px; font-size: 12px; margin-bottom: 5px; border-radius: 4px;">
                    <button class="aero-btn" onclick="updateGroupIcon()" style="width: 100%; padding: 6px; font-size: 12px; border-radius: 4px;">Grup Fotoğrafını Değiştir</button>
                </div>

                <h3 style="margin: 0 0 10px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">Grup Üyeleri (<span id="userCount">0</span>)</h3>
                <div id="participantsList" style="display: flex; flex-direction: column; gap: 5px;"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_PIN = "1992";
        let myUsername = '';
        let myAvatar = localStorage.getItem('project_tr_avatar') || '';
        let notificationsEnabled = false;
        let allKnownUsers = new Set();
        let knownProfiles = {}; 
        let currentGroupSettings = { icon: '', admins: [] };
        let pinnedMessages = new Map(); 
        let currentPinnedId = null;

        const socket = io();
        const standardSound = new Audio('https://actions.google.com/sounds/v1/water/water_drop.ogg');
        const mentionSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        function unlockAudio() {
            standardSound.play().then(() => { standardSound.pause(); standardSound.currentTime = 0; }).catch(()=>{});
            mentionSound.play().then(() => { mentionSound.pause(); mentionSound.currentTime = 0; }).catch(()=>{});
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => { document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight; });
        }

        function getAvatarHtml(user, size = 32) {
            const avatarUrl = knownProfiles[user];
            if (avatarUrl) return `<img src="${escapeHtml(avatarUrl)}" style="width: ${size}px; height: ${size}px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;">`;
            else return `<div style="width: ${size}px; height: ${size}px; border-radius: 50%; background: #00b4d8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: ${size/2}px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;">${user.charAt(0).toUpperCase()}</div>`;
        }

        socket.on('group_settings', (settings) => {
            currentGroupSettings = settings;
            document.getElementById('headerGroupIcon').src = settings.icon;
            document.getElementById('modalGroupIcon').src = settings.icon;
            if (!document.getElementById('groupInfoOverlay').classList.contains('hidden')) renderParticipants();
        });

        function openGroupInfo() {
            document.getElementById('groupInfoOverlay').classList.remove('hidden');
            document.getElementById('myAvatarUrl').value = localStorage.getItem('project_tr_avatar') || '';
            if (currentGroupSettings.admins.includes(myUsername)) document.getElementById('adminControls').classList.remove('hidden');
            else document.getElementById('adminControls').classList.add('hidden');
            renderParticipants();
        }

        function closeGroupInfo() { document.getElementById('groupInfoOverlay').classList.add('hidden'); document.getElementById('newIconUrl').value = ''; }
        
        function updateMyAvatar() {
            const url = document.getElementById('myAvatarUrl').value.trim();
            localStorage.setItem('project_tr_avatar', url);
            myAvatar = url; knownProfiles[myUsername] = url; socket.emit('update_avatar', url);
            alert("Kişisel profil fotoğrafın güncellendi kanka!"); renderParticipants();
        }
        
        function updateGroupIcon() { const url = document.getElementById('newIconUrl').value.trim(); if(url) { socket.emit('change_group_icon', url); document.getElementById('newIconUrl').value = ''; } }
        function makeAdmin(targetUser) { if(confirm(`${targetUser} adlı kişiyi Yönetici yapmak istiyor musun?`)) socket.emit('make_admin', targetUser); }

        function renderParticipants() {
            const listDiv = document.getElementById('participantsList');
            listDiv.innerHTML = '';
            const usersArray = Array.from(allKnownUsers);
            document.getElementById('userCount').textContent = usersArray.length;
            document.getElementById('headerUserCount').textContent = `${usersArray.length} üye`;
            usersArray.forEach(user => {
                const isAdmin = currentGroupSettings.admins.includes(user);
                const isMe = user === myUsername;
                const amIAdmin = currentGroupSettings.admins.includes(myUsername);
                const item = document.createElement('div');
                item.className = 'participant-item';
                let html = `<div style="display: flex; align-items: center; gap: 10px;">${getAvatarHtml(user, 28)}<span style="font-size: 14px;">${user} ${isMe ? '(Sen)' : ''}</span>${isAdmin ? '<span class="admin-badge">Yönetici</span>' : ''}</div>`;
                if (amIAdmin && !isAdmin) html += `<button class="make-admin-btn" onclick="makeAdmin('${user}')">Yönetici Yap</button>`;
                item.innerHTML = html; listDiv.appendChild(item);
            });
        }

        function checkPin() {
            if (document.getElementById('pinInput').value === SECRET_PIN) {
                unlockAudio(); document.getElementById('lockScreen').classList.add('hidden');
                
                const savedUser = localStorage.getItem('project_tr_username');
                if (savedUser) {
                    
                    // OTOMATİK TEKRAR DENEME (HAYALET KIRICI)
                    function tryLogin(retriesLeft) {
                        socket.emit('set-username', { username: savedUser, avatar: myAvatar }, (response) => {
                            if (response.success) {
                                myUsername = savedUser; 
                                document.getElementById('currentUserDisplay').textContent = myUsername;
                                document.getElementById('chatContainer').classList.remove('hidden'); 
                                document.getElementById('messageInput').focus();
                            } else {
                                if (retriesLeft > 0) {
                                    // Sunucuda hayalet asılı kalmış olabilir, 1 saniye bekle bir daha zorla
                                    setTimeout(() => tryLogin(retriesLeft - 1), 1000);
                                } else {
                                    // 2 kerede de giremezse ekranı aç ama HAFIZAYI SİLME
                                    document.getElementById('nickErrorMsg').textContent = "İsmin asılı kaldı veya dolu. Biraz bekle veya bağlanmayı tekrar dene kanka.";
                                    document.getElementById('nickErrorMsg').style.display = 'block';
                                    document.getElementById('nicknameScreen').classList.remove('hidden');
                                    document.getElementById('nicknameInput').value = savedUser;
                                }
                            }
                        });
                    }
                    
                    tryLogin(2); // Bağlantıyı 2 kere zorla
                    
                } else { document.getElementById('nicknameScreen').classList.remove('hidden'); document.getElementById('nicknameInput').focus(); }
            } else document.getElementById('errorMsg').style.display = 'block';
        }

        function setNickname() {
            unlockAudio();
            const enteredName = document.getElementById('nicknameInput').value.trim();
            if (!enteredName) { document.getElementById('nickErrorMsg').textContent = "İsim boş bırakılamaz!"; document.getElementById('nickErrorMsg').style.display = 'block'; return; }
            socket.emit('set-username', { username: enteredName, avatar: myAvatar }, (response) => {
                if (response.success) {
                    myUsername = enteredName; localStorage.setItem('project_tr_username', myUsername); localStorage.setItem('project_tr_nick_date', Date.now().toString());
                    document.getElementById('currentUserDisplay').textContent = myUsername; document.getElementById('nicknameScreen').classList.add('hidden');
                    document.getElementById('chatContainer').classList.remove('hidden'); document.getElementById('messageInput').focus();
                } else { document.getElementById('nickErrorMsg').textContent = response.message; document.getElementById('nickErrorMsg').style.display = 'block'; }
            });
        }

        function requestChangeNick() {
            const lastSetDate = parseInt(localStorage.getItem('project_tr_nick_date') || '0');
            if (Date.now() - lastSetDate < 1209600000) alert(`Kanka kullanıcı adını değiştirmek için 2 haftalık süren daha dolmadı!`);
            else { if (confirm("Kullanıcı adını değiştirmek istiyor musun?")) { localStorage.removeItem('project_tr_username'); location.reload(); } }
        }

        function toggleNotifications() {
            const btn = document.getElementById('notifBtn');
            if (!notificationsEnabled) {
                Notification.requestPermission().then(p => {
                    if (p === "granted") { notificationsEnabled = true; btn.textContent = "🔕"; btn.classList.add('active'); }
                });
            } else { notificationsEnabled = false; btn.textContent = "🔔"; btn.classList.remove('active'); }
        }

        document.getElementById('pinInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPin(); });
        document.getElementById('nicknameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') setNickname(); });

        const form = document.getElementById('form');
        const messageInput = document.getElementById('messageInput');
        const chat = document.getElementById('chat');
        const mentionDropdown = document.getElementById('mentionDropdown');

        socket.on('init_messages', (messages) => {
            messages.forEach(msg => {
                allKnownUsers.add(msg.user);
                displayMessage(msg);
                if(msg.pinned) pinnedMessages.set(msg._id, msg);
            });
            document.getElementById('headerUserCount').textContent = `${allKnownUsers.size} üye`;
            updatePinnedBar();
        });

        socket.on('active_users', (usersData) => {
            usersData.forEach(u => { allKnownUsers.add(u.username); if(u.avatar) knownProfiles[u.username] = u.avatar; });
            document.getElementById('headerUserCount').textContent = `${allKnownUsers.size} üye`;
            if (!document.getElementById('groupInfoOverlay').classList.contains('hidden')) renderParticipants();
        });

        messageInput.addEventListener('input', function() {
            const val = this.value; const match = val.substring(0, this.selectionStart).match(/(?:^|\s)@(\w*)$/);
            if (match) {
                const query = match[1].toLowerCase();
                const filteredUsers = Array.from(allKnownUsers).filter(u => u.toLowerCase().includes(query) && u !== myUsername);
                if (filteredUsers.length > 0) {
                    mentionDropdown.innerHTML = '';
                    filteredUsers.forEach(user => {
                        const item = document.createElement('div'); item.className = 'mention-item';
                        item.innerHTML = `<div style="display:flex; align-items:center; gap:10px;">${getAvatarHtml(user, 26)} <div>${user}</div></div>`;
                        item.onclick = function() {
                            messageInput.value = `${val.substring(0, val.lastIndexOf('@'))}@${user} ${val.substring(messageInput.selectionStart)}`;
                            mentionDropdown.style.display = 'none'; messageInput.focus();
                        }; mentionDropdown.appendChild(item);
                    }); mentionDropdown.style.display = 'flex';
                } else mentionDropdown.style.display = 'none';
            } else mentionDropdown.style.display = 'none';
        });

        document.addEventListener('click', (e) => {
            if (!mentionDropdown.contains(e.target) && e.target !== messageInput) mentionDropdown.style.display = 'none';
            if (e.target === document.getElementById('groupInfoOverlay')) closeGroupInfo();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault(); mentionDropdown.style.display = 'none';
            if (messageInput.value.trim() && myUsername) { socket.emit('chat message', { user: myUsername, text: messageInput.value }); messageInput.value = ''; }
        });

        socket.on('chat message', function(msg) {
            allKnownUsers.add(msg.user); if(msg.avatar) knownProfiles[msg.user] = msg.avatar;
            document.getElementById('headerUserCount').textContent = `${allKnownUsers.size} üye`;
            displayMessage(msg);
            
            if (msg.user !== myUsername) {
                if (myUsername && msg.text.includes(`@${myUsername}`)) {
                    mentionSound.currentTime = 0; mentionSound.play().catch(()=>{});
                    try { if (Notification.permission === "granted") new Notification(`@${myUsername} seni etiketledi!`, { body: `${msg.user}: ${msg.text}` }); } catch(e) {}
                } else if (notificationsEnabled) {
                    standardSound.currentTime = 0; standardSound.play().catch(()=>{});
                    try { if (Notification.permission === "granted") new Notification(`Yeni mesaj: ${msg.user}`, { body: msg.text }); } catch(e) {}
                }
            }
        });

        socket.on('pinned_updated', (updatedMsg) => {
            const msgEl = document.getElementById('msg-' + updatedMsg._id);
            if (updatedMsg.pinned) {
                pinnedMessages.set(updatedMsg._id, updatedMsg);
                if(msgEl) msgEl.classList.add('is-pinned');
            } else {
                pinnedMessages.delete(updatedMsg._id);
                if(msgEl) msgEl.classList.remove('is-pinned');
            }
            updatePinnedBar();
        });

        function togglePin(msgId) { socket.emit('toggle_pin', msgId); }

        function updatePinnedBar() {
            if (pinnedMessages.size > 0) {
                const lastPinned = Array.from(pinnedMessages.values()).pop();
                document.getElementById('pinnedBar').classList.remove('hidden');
                document.getElementById('pinnedContent').textContent = `${lastPinned.user}: ${lastPinned.text}`;
                currentPinnedId = lastPinned._id;
            } else {
                document.getElementById('pinnedBar').classList.add('hidden');
                currentPinnedId = null;
            }
        }

        function scrollToPinned() {
            if (currentPinnedId) {
                const el = document.getElementById('msg-' + currentPinnedId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.style.background = 'rgba(255, 235, 59, 0.4)';
                    setTimeout(() => { el.style.background = 'rgba(255, 255, 255, 0.25)'; }, 1500);
                }
            }
        }

        function displayMessage(msg) {
            const item = document.createElement('div');
            item.className = 'message';
            if(msg._id) item.id = 'msg-' + msg._id; 
            if(msg.pinned) item.classList.add('is-pinned');
            
            let formattedText = escapeHtml(msg.text);
            if (myUsername && msg.text.includes(`@${myUsername}`)) {
                item.classList.add('mentioned');
                formattedText = formattedText.replace(new RegExp(`@${myUsername}`, 'g'), `<span class="mention-tag">@${myUsername}</span>`);
            }

            const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const amIAdmin = currentGroupSettings.admins.includes(myUsername);
            const pinButtonHtml = amIAdmin && msg._id ? `<button class="pin-btn" onclick="togglePin('${msg._id}')" title="Sabitle / Kaldır">📌</button>` : '';

            item.innerHTML = `
                <div style="display: flex; align-items: flex-start; gap: 10px;">
                    ${getAvatarHtml(msg.user, 35)}
                    <div style="flex: 1; min-width: 0;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
                            <span class="username" style="margin: 0;">${msg.user}</span>
                            <span class="time" style="margin: 0;">${timeStr} ${pinButtonHtml}</span>
                        </div>
                        <div style="line-height: 1.4; font-size: 15px;">${formattedText}</div>
                    </div>
                </div>
            `;
            chat.appendChild(item);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
