<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fizik 11 - Çalışma Notları</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #1a73e8 0%, #00b4d8 50%, #90e0ef 100%); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: transparent;
            position: relative;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 850px;
                max-height: 85vh;
                height: 85vh;
                border-radius: 16px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(255, 255, 255, 0.3);
                background: rgba(18, 18, 18, 0.4);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                padding: 20px;
            }
        }

        .hidden { display: none !important; }
        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 30, 60, 0.37);
            border-radius: 12px;
            padding: 15px;
        }
        .center-screen {
            position: absolute;
            width: 90%;
            max-width: 400px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-align: center;
            z-index: 100;
        }
        .center-screen input, .center-screen button { 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.5); 
            background: rgba(0, 0, 0, 0.3); 
            color: #fff; 
            width: 220px; 
            text-align: center; 
            outline: none;
        }
        .aero-btn { 
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border: 1px solid #ffffff; 
            color: #fff;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 5px rgba(0,0,0,0.2);
            text-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }
        .aero-btn:hover { background: linear-gradient(to bottom, #00f2fe 0%, #4facfe 100%); }
        
        #chatContainer { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; position: relative; }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }
        .header-buttons { display: flex; gap: 6px; }
        #chat { flex: 1; border-radius: 10px; padding: 12px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .message { background: rgba(255, 255, 255, 0.25); padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 80%; word-break: break-word; border: 1px solid rgba(255,255,255,0.2); }
        .message.mentioned { background: rgba(255, 193, 7, 0.35); border-color: #ffc107; }
        .message span.username { font-weight: bold; color: #ffeb3b; margin-right: 8px; }
        .message span.time { font-size: 11px; color: rgba(255,255,255,0.7); margin-left: 10px; float: right; margin-top: 3px; }
        .mention-tag { background: rgba(255, 235, 59, 0.4); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .form-wrapper { position: relative; display: flex; flex-direction: column; }
        .form-group { display: flex; gap: 8px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); font-size: 16px; background: rgba(255, 255, 255, 0.2); color: #fff; outline: none; }
        #messageInput { flex: 1; }

        /* WhatsApp Tarzı Etiket Öneri Kutusu (Autocomplete Dropdown) */
        #mentionDropdown {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 250px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 500;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .mention-item {
            padding: 10px 15px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }
        .mention-item:hover {
            background: rgba(79, 172, 254, 0.4);
        }

        .action-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn.active { background: #4facfe; border-color: #fff; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. Şifre Kilit Ekranı -->
        <div id="lockScreen" class="glass-box center-screen">
            <h2>📚 Fizik 11 - Ünite 2 Notları</h2>
            <input id="pinInput" type="password" placeholder="Şifre..." />
            <button class="aero-btn" onclick="checkPin()">Giriş Yap</button>
            <p id="errorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;">Hatalı şifre!</p>
        </div>
        
        <!-- 2. Nickname Seçim Ekranı -->
        <div id="nicknameScreen" class="glass-box center-screen hidden">
            <h2>🚗 Project TR // Nickname</h2>
            <p style="font-size: 13px; margin: 0; color: rgba(255,255,255,0.9);">Bu cihaz için adını belirle (2 hafta değiştiremezsin):</p>
            <input id="nicknameInput" type="text" placeholder="Kullanıcı adın..." autocomplete="off" />
            <button class="aero-btn" onclick="setNickname()">Sisteme Gir</button>
            <p id="nickErrorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;"></p>
        </div>

        <!-- 3. Asıl Sohbet Ekranı -->
        <div id="chatContainer" class="hidden">
            <div class="chat-header">
                <h2 style="margin: 0; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">🌐 Project TR (<span id="currentUserDisplay" style="color: #ffeb3b;"></span>)</h2>
                <div class="header-buttons">
                    <button id="changeNickBtn" class="action-btn" onclick="requestChangeNick()" title="2 haftada bir değiştirilebilir">⚙️ Nick Değiştir</button>
                    <button id="notifBtn" class="action-btn" onclick="toggleNotifications()">🔔 Bildirim</button>
                </div>
            </div>
            
            <div id="chat" class="glass-box"></div>
            
            <!-- Form ve WhatsApp Tarzı Etiket Öneri Kutusu -->
            <div class="form-wrapper">
                <div id="mentionDropdown"></div>
                <form id="form" class="form-group">
                    <input id="messageInput" type="text" placeholder="Mesajını yaz veya @etiketle..." required autocomplete="off" />
                    <button class="aero-btn" type="submit">Gönder</button>
                </form>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_PIN = "1992";
        let myUsername = '';
        let notificationsEnabled = false;
        let onlineUsers = [];
        const socket = io();

        // Online kullanıcı listesini sunucudan al
        socket.on('active_users', (users) => {
            onlineUsers = users;
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const chat = document.getElementById('chat');
                chat.scrollTop = chat.scrollHeight;
            });
        }

        // Web Audio API ile Standart Zil Sesi
        function playStandardSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        // Web Audio API ile Dikkat Çekici Etiketleme (Mention) Sesi (Bildirimler kapalı olsa bile çalar)
        function playMentionSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [0, 0.12, 0.24].forEach((delay, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(659.25 + (index * 220), now + delay);
                    gain.gain.setValueAtTime(0.25, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.12);
                });
            } catch(e) {}
        }

        function checkPin() {
            if (document.getElementById('pinInput').value === SECRET_PIN) {
                document.getElementById('lockScreen').classList.add('hidden');
                
                const savedUser = localStorage.getItem('project_tr_username');
                if (savedUser) {
                    socket.emit('set-username', savedUser, (response) => {
                        if (response.success) {
                            myUsername = savedUser;
                            document.getElementById('currentUserDisplay').textContent = myUsername;
                            document.getElementById('chatContainer').classList.remove('hidden');
                            document.getElementById('messageInput').focus();
                        } else {
                            localStorage.removeItem('project_tr_username');
                            document.getElementById('nicknameScreen').classList.remove('hidden');
                            document.getElementById('nicknameInput').focus();
                        }
                    });
                } else {
                    document.getElementById('nicknameScreen').classList.remove('hidden');
                    document.getElementById('nicknameInput').focus();
                }
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function setNickname() {
            const enteredName = document.getElementById('nicknameInput').value.trim();
            const nickErr = document.getElementById('nickErrorMsg');
            
            if (!enteredName) {
                nickErr.textContent = "İsim boş bırakılamaz kanka!";
                nickErr.style.display = 'block';
                return;
            }

            socket.emit('set-username', enteredName, (response) => {
                if (response.success) {
                    myUsername = enteredName;
                    localStorage.setItem('project_tr_username', myUsername);
                    localStorage.setItem('project_tr_nick_date', Date.now().toString());

                    document.getElementById('currentUserDisplay').textContent = myUsername;
                    document.getElementById('nicknameScreen').classList.add('hidden');
                    document.getElementById('chatContainer').classList.remove('hidden');
                    document.getElementById('messageInput').focus();
                } else {
                    nickErr.textContent = response.message;
                    nickErr.style.display = 'block';
                }
            });
        }

        function requestChangeNick() {
            const lastSetDate = parseInt(localStorage.getItem('project_tr_nick_date') || '0');
            const twoWeeksMs = 14 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            if (now - lastSetDate < twoWeeksMs) {
                const remainingDays = Math.ceil((twoWeeksMs - (now - lastSetDate)) / (1000 * 60 * 60 * 24));
                alert(`Kanka kullanıcı adını değiştirmek için ${remainingDays} gün daha beklemelisin! (2 haftada bir değişebilir)`);
            } else {
                if (confirm("Kullanıcı adını değiştirmek istiyor musun? Süren dolmuş.")) {
                    localStorage.removeItem('project_tr_username');
                    localStorage.removeItem('project_tr_nick_date');
                    location.reload();
                }
            }
        }

        function toggleNotifications() {
            const btn = document.getElementById('notifBtn');
            if (!notificationsEnabled) {
                if (!("Notification" in window)) {
                    alert("Tarayıcınız bildirimleri desteklemiyor kanka!");
                    return;
                }
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        notificationsEnabled = true;
                        btn.textContent = "🔕 Açık";
                        btn.classList.add('active');
                    } else {
                        alert("Bildirim izni vermedin kanka.");
                    }
                });
            } else {
                notificationsEnabled = false;
                btn.textContent = "🔔 Bildirim";
                btn.classList.remove('active');
            }
        }

        document.getElementById('pinInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPin(); });
        document.getElementById('nicknameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') setNickname(); });

        const form = document.getElementById('form');
        const messageInput = document.getElementById('messageInput');
        const chat = document.getElementById('chat');
        const mentionDropdown = document.getElementById('mentionDropdown');

        // WhatsApp Tarzı @ Autocomplete Mantığı
        messageInput.addEventListener('input', function() {
            const val = this.value;
            const cursorPosition = this.selectionStart;
            
            // İmlecin olduğu yerde "@" var mı diye kontrol et
            const textBeforeCursor = val.substring(0, cursorPosition);
            const match = textBeforeCursor.match(/@(\w*)$/);

            if (match) {
                const query = match[1].toLowerCase();
                const filteredUsers = onlineUsers.filter(u => u.toLowerCase().includes(query) && u !== myUsername);

                if (filteredUsers.length > 0) {
                    mentionDropdown.innerHTML = '';
                    filteredUsers.forEach(user => {
                        const item = document.createElement('div');
                        item.className = 'mention-item';
                        item.textContent = `@${user}`;
                        item.onclick = function() {
                            const currentVal = messageInput.value;
                            const beforeAt = currentVal.substring(0, textBeforeCursor.lastIndexOf('@'));
                            const afterCursor = currentVal.substring(cursorPosition);
                            messageInput.value = `${beforeAt}@${user} ${afterCursor}`;
                            mentionDropdown.style.display = 'none';
                            messageInput.focus();
                        };
                        mentionDropdown.appendChild(item);
                    });
                    mentionDropdown.style.display = 'flex';
                } else {
                    mentionDropdown.style.display = 'none';
                }
            } else {
                mentionDropdown.style.display = 'none';
            }
        });

        // Input dışına tıklandığında veya boşluk basıldığında dropdown kapansın
        document.addEventListener('click', (e) => {
            if (!messageInput.contains(e.target) && !mentionDropdown.contains(e.target)) {
                mentionDropdown.style.display = 'none';
            }
        });

        socket.on('init_messages', (messages) => {
            messages.forEach(msg => displayMessage(msg));
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            mentionDropdown.style.display = 'none';
            if (messageInput.value.trim() && myUsername) {
                socket.emit('chat message', { user: myUsername, text: messageInput.value });
                messageInput.value = '';
            }
        });

        // Mesaj Geldiğinde Ses ve Bildirim Yönetimi
        socket.on('chat message', function(msg) {
            displayMessage(msg);
            
            if (msg.user !== myUsername) {
                const isMentioned = myUsername && msg.text.includes(`@${myUsername}`);
                
                if (isMentioned) {
                    // ETİKETLENDİN! Bildirimler kapalı olsa bile ÖZEL SES çal ve sistem bildirimi fırlat
                    playMentionSound();
                    try {
                        if ("Notification" in window) {
                            if (Notification.permission === "granted") {
                                new Notification(`@${myUsername} seni etiketledi!`, {
                                    body: `${msg.user}: ${msg.text}`,
                                    icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png'
                                });
                            } else if (Notification.permission !== "denied") {
                                Notification.requestPermission().then(permission => {
                                    if (permission === "granted") {
                                        new Notification(`@${myUsername} seni etiketledi!`, {
                                            body: `${msg.user}: ${msg.text}`,
                                            icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png'
                                        });
                                    }
                                });
                            }
                        }
                    } catch(e) {}
                } else if (notificationsEnabled) {
                    // Normal mesajlar (Bildirimler butonla açıldıysa)
                    playStandardSound();
                    try {
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(`Yeni mesaj: ${msg.user}`, {
                                body: msg.text,
                                icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png'
                            });
                        }
                    } catch(e) {}
                }
            }
        });

        function displayMessage(msg) {
            const item = document.createElement('div');
            item.className = 'message';
            
            let formattedText = escapeHtml(msg.text);
            if (myUsername && msg.text.includes(`@${myUsername}`)) {
                item.classList.add('mentioned');
                formattedText = formattedText.replace(new RegExp(`@${myUsername}`, 'g'), `<span class="mention-tag">@${myUsername}</span>`);
            }

            const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            item.innerHTML = `<span class="username">${msg.user}:</span> ${formattedText} <span class="time">${timeStr}</span>`;
            chat.appendChild(item);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
