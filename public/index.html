<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fizik 11 - Çalışma Notları</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #1a73e8 0%, #00b4d8 50%, #90e0ef 100%); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: transparent;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 850px;
                max-height: 85vh;
                height: 85vh;
                border-radius: 16px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(255, 255, 255, 0.3);
                background: rgba(18, 18, 18, 0.4);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                padding: 20px;
            }
        }

        .hidden { display: none !important; }
        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 30, 60, 0.37);
            border-radius: 12px;
            padding: 15px;
        }
        .center-screen {
            position: absolute;
            width: 90%;
            max-width: 400px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-align: center;
            z-index: 100;
        }
        .center-screen input, .center-screen button { 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.5); 
            background: rgba(0, 0, 0, 0.3); 
            color: #fff; 
            width: 220px; 
            text-align: center; 
            outline: none;
        }
        .aero-btn { 
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border: 1px solid #ffffff; 
            color: #fff;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 5px rgba(0,0,0,0.2);
            text-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }
        .aero-btn:hover { background: linear-gradient(to bottom, #00f2fe 0%, #4facfe 100%); }
        
        #chatContainer { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }
        .header-buttons { display: flex; gap: 6px; }
        #chat { flex: 1; border-radius: 10px; padding: 12px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .message { background: rgba(255, 255, 255, 0.25); padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 80%; word-break: break-word; border: 1px solid rgba(255,255,255,0.2); }
        .message.mentioned { background: rgba(255, 193, 7, 0.35); border-color: #ffc107; box-shadow: 0 0 10px rgba(255,193,7,0.4); }
        .message span.username { font-weight: bold; color: #ffeb3b; margin-right: 8px; }
        .message span.time { font-size: 11px; color: rgba(255,255,255,0.7); margin-left: 10px; float: right; margin-top: 3px; }
        .mention-tag { background: rgba(255, 235, 59, 0.4); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .form-group { position: relative; display: flex; gap: 8px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); font-size: 16px; background: rgba(255, 255, 255, 0.2); color: #fff; outline: none; }
        #messageInput { flex: 1; }

        /* WhatsApp Tarzı @ Menüsü */
        .mention-menu {
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 8px;
            width: 250px;
            background: #2a2f32;
            border-radius: 8px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow-y: auto;
            max-height: 200px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mention-item {
            padding: 10px 15px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .mention-item:hover { background: #3b4043; }
        .mention-avatar {
            width: 32px;
            height: 32px;
            background: #00b4d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .action-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn.active { background: #4facfe; border-color: #fff; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. Şifre Kilit Ekranı -->
        <div id="lockScreen" class="glass-box center-screen">
            <h2>📚 Fizik 11 - Ünite 2 Notları</h2>
            <input id="pinInput" type="password" placeholder="Şifre..." />
            <button class="aero-btn" onclick="checkPin()">Giriş Yap</button>
            <p id="errorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;">Hatalı şifre!</p>
        </div>
        
        <!-- 2. Nickname Seçim Ekranı -->
        <div id="nicknameScreen" class="glass-box center-screen hidden">
            <h2>🚗 Project TR // Nickname</h2>
            <p style="font-size: 13px; margin: 0; color: rgba(255,255,255,0.9);">Bu cihaz için adını belirle (2 hafta değiştiremezsin):</p>
            <input id="nicknameInput" type="text" placeholder="Kullanıcı adın..." autocomplete="off" />
            <button class="aero-btn" onclick="setNickname()">Sisteme Gir</button>
            <p id="nickErrorMsg" style="color: #ffdddd; display: none; margin: 0; font-size: 14px;"></p>
        </div>

        <!-- 3. Asıl Sohbet Ekranı -->
        <div id="chatContainer" class="hidden">
            <div class="chat-header">
                <h2 style="margin: 0; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">🌐 Project TR (<span id="currentUserDisplay" style="color: #ffeb3b;"></span>)</h2>
                <div class="header-buttons">
                    <button id="changeNickBtn" class="action-btn" onclick="requestChangeNick()" title="2 haftada bir değiştirilebilir">⚙️ Nick Değiştir</button>
                    <button id="notifBtn" class="action-btn" onclick="toggleNotifications()">🔔 Bildirim</button>
                </div>
            </div>
            
            <div id="chat" class="glass-box"></div>
            
            <form id="form" class="form-group">
                <!-- WhatsApp Tarzı @ Menüsü -->
                <div id="mentionDropdown" class="mention-menu"></div>
                <input id="messageInput" type="text" placeholder="Mesajını yaz veya @etiketle..." required autocomplete="off" />
                <button class="aero-btn" type="submit">Gönder</button>
            </form>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_PIN = "1992";
        let myUsername = '';
        let notificationsEnabled = false;
        let allKnownUsers = new Set(); // Geçmişteki ve aktif tüm kullanıcıları burada tutuyoruz
        const socket = io();

        // 1. Google Sunucularından Çekilen Garantili Sesler
        const standardSound = new Audio('https://actions.google.com/sounds/v1/water/water_drop.ogg');
        const mentionSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        // Tarayıcının ses engelini kırmak için butona basıldığında sesleri gizlice oynatıp durduruyoruz
        function unlockAudio() {
            standardSound.play().then(() => { standardSound.pause(); standardSound.currentTime = 0; }).catch(()=>{});
            mentionSound.play().then(() => { mentionSound.pause(); mentionSound.currentTime = 0; }).catch(()=>{});
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const chat = document.getElementById('chat');
                chat.scrollTop = chat.scrollHeight;
            });
        }

        function checkPin() {
            if (document.getElementById('pinInput').value === SECRET_PIN) {
                unlockAudio(); // Ses kilidini kır
                document.getElementById('lockScreen').classList.add('hidden');
                
                const savedUser = localStorage.getItem('project_tr_username');
                if (savedUser) {
                    socket.emit('set-username', savedUser, (response) => {
                        if (response.success) {
                            myUsername = savedUser;
                            document.getElementById('currentUserDisplay').textContent = myUsername;
                            document.getElementById('chatContainer').classList.remove('hidden');
                            document.getElementById('messageInput').focus();
                        } else {
                            localStorage.removeItem('project_tr_username');
                            document.getElementById('nicknameScreen').classList.remove('hidden');
                            document.getElementById('nicknameInput').focus();
                        }
                    });
                } else {
                    document.getElementById('nicknameScreen').classList.remove('hidden');
                    document.getElementById('nicknameInput').focus();
                }
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function setNickname() {
            unlockAudio(); // Ses kilidini kır
            const enteredName = document.getElementById('nicknameInput').value.trim();
            const nickErr = document.getElementById('nickErrorMsg');
            
            if (!enteredName) {
                nickErr.textContent = "İsim boş bırakılamaz kanka!";
                nickErr.style.display = 'block';
                return;
            }

            socket.emit('set-username', enteredName, (response) => {
                if (response.success) {
                    myUsername = enteredName;
                    localStorage.setItem('project_tr_username', myUsername);
                    localStorage.setItem('project_tr_nick_date', Date.now().toString());

                    document.getElementById('currentUserDisplay').textContent = myUsername;
                    document.getElementById('nicknameScreen').classList.add('hidden');
                    document.getElementById('chatContainer').classList.remove('hidden');
                    document.getElementById('messageInput').focus();
                } else {
                    nickErr.textContent = response.message;
                    nickErr.style.display = 'block';
                }
            });
        }

        function requestChangeNick() {
            const lastSetDate = parseInt(localStorage.getItem('project_tr_nick_date') || '0');
            const twoWeeksMs = 14 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            if (now - lastSetDate < twoWeeksMs) {
                const remainingDays = Math.ceil((twoWeeksMs - (now - lastSetDate)) / (1000 * 60 * 60 * 24));
                alert(`Kanka kullanıcı adını değiştirmek için ${remainingDays} gün daha beklemelisin!`);
            } else {
                if (confirm("Kullanıcı adını değiştirmek istiyor musun?")) {
                    localStorage.removeItem('project_tr_username');
                    localStorage.removeItem('project_tr_nick_date');
                    location.reload();
                }
            }
        }

        function toggleNotifications() {
            const btn = document.getElementById('notifBtn');
            if (!notificationsEnabled) {
                if (!("Notification" in window)) {
                    alert("Tarayıcınız bildirimleri desteklemiyor kanka!");
                    return;
                }
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        notificationsEnabled = true;
                        btn.textContent = "🔕 Açık";
                        btn.classList.add('active');
                    } else {
                        alert("Kanka tarayıcının adres çubuğundaki kilit (veya i) simgesine tıklayıp bildirimlere İZİN VER demen lazım, yoksa bildirim düşmez!");
                    }
                });
            } else {
                notificationsEnabled = false;
                btn.textContent = "🔔 Bildirim";
                btn.classList.remove('active');
            }
        }

        document.getElementById('pinInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPin(); });
        document.getElementById('nicknameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') setNickname(); });

        const form = document.getElementById('form');
        const messageInput = document.getElementById('messageInput');
        const chat = document.getElementById('chat');
        const mentionDropdown = document.getElementById('mentionDropdown');

        // WHATSAPP TARZI @ ETİKETLEME MENÜSÜ MANTIĞI
        socket.on('init_messages', (messages) => {
            messages.forEach(msg => {
                allKnownUsers.add(msg.user);
                displayMessage(msg);
            });
        });

        socket.on('active_users', (users) => {
            users.forEach(u => allKnownUsers.add(u));
        });

        messageInput.addEventListener('input', function() {
            const val = this.value;
            const cursorPosition = this.selectionStart;
            const textBeforeCursor = val.substring(0, cursorPosition);
            
            // "@" işareti ve sonrasındaki harfleri yakala
            const match = textBeforeCursor.match(/(?:^|\s)@(\w*)$/);

            if (match) {
                const query = match[1].toLowerCase();
                const filteredUsers = Array.from(allKnownUsers).filter(u => 
                    u.toLowerCase().includes(query) && u !== myUsername
                );

                if (filteredUsers.length > 0) {
                    mentionDropdown.innerHTML = '';
                    filteredUsers.forEach(user => {
                        const item = document.createElement('div');
                        item.className = 'mention-item';
                        item.innerHTML = `<div class="mention-avatar">${user.charAt(0).toUpperCase()}</div><div>${user}</div>`;
                        
                        item.onclick = function() {
                            const currentVal = messageInput.value;
                            const beforeAt = textBeforeCursor.substring(0, textBeforeCursor.lastIndexOf('@'));
                            const afterCursor = currentVal.substring(cursorPosition);
                            
                            messageInput.value = `${beforeAt}@${user} ${afterCursor}`;
                            mentionDropdown.style.display = 'none';
                            messageInput.focus();
                        };
                        mentionDropdown.appendChild(item);
                    });
                    mentionDropdown.style.display = 'flex';
                } else {
                    mentionDropdown.style.display = 'none';
                }
            } else {
                mentionDropdown.style.display = 'none';
            }
        });

        // Menü dışına tıklanınca gizle
        document.addEventListener('click', (e) => {
            if (!mentionDropdown.contains(e.target) && e.target !== messageInput) {
                mentionDropdown.style.display = 'none';
            }
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            mentionDropdown.style.display = 'none';
            if (messageInput.value.trim() && myUsername) {
                socket.emit('chat message', { user: myUsername, text: messageInput.value });
                messageInput.value = '';
            }
        });

        // MESAJ GELDİĞİNDE: SES VE BİLDİRİM PATLATMA
        socket.on('chat message', function(msg) {
            allKnownUsers.add(msg.user);
            displayMessage(msg);
            
            if (msg.user !== myUsername) {
                const isMentioned = myUsername && msg.text.includes(`@${myUsername}`);
                
                if (isMentioned) {
                    // ETİKETLENDİN! Özel dikkat çekici sesi her türlü çal (Bildirim kapalı olsa bile)
                    mentionSound.currentTime = 0;
                    mentionSound.play().catch(()=>{});
                    
                    // Tarayıcı Bildirimi (Ekrana düşmesi için İZİN verilmiş olmalı)
                    try {
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(`@${myUsername} seni etiketledi!`, {
                                body: `${msg.user}: ${msg.text}`,
                                icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png'
                            });
                        }
                    } catch(e) {}
                } else if (notificationsEnabled) {
                    // Normal bildirim (Sadece "Bildirim" butonuna basılıysa)
                    standardSound.currentTime = 0;
                    standardSound.play().catch(()=>{});
                    
                    try {
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(`Yeni mesaj: ${msg.user}`, {
                                body: msg.text,
                                icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233483.png'
                            });
                        }
                    } catch(e) {}
                }
            }
        });

        function displayMessage(msg) {
            const item = document.createElement('div');
            item.className = 'message';
            
            let formattedText = escapeHtml(msg.text);
            if (myUsername && msg.text.includes(`@${myUsername}`)) {
                item.classList.add('mentioned');
                formattedText = formattedText.replace(new RegExp(`@${myUsername}`, 'g'), `<span class="mention-tag">@${myUsername}</span>`);
            }

            const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            item.innerHTML = `<span class="username">${msg.user}:</span> ${formattedText} <span class="time">${timeStr}</span>`;
            chat.appendChild(item);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
